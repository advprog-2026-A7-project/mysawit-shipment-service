name: CD - Deploy Shipment to EC2

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref to deploy (main only)
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: shipment-cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shipment Service (EC2)
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PORT: ${{ vars.STAGING_PORT }}
      REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
      SHIPMENT_HOST_PORT: ${{ vars.SHIPMENT_HOST_PORT }}

      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

    steps:
      - name: Validate deployment inputs and secrets
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.deploy_ref }}" != "main" ]; then
            echo "::error::deploy_ref must be 'main'"
            exit 1
          fi

          required_secrets=(
            STAGING_HOST
            STAGING_USER
            STAGING_SSH_KEY
            SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD
            JWT_SECRET
            CORS_ORIGINS
          )

          missing=()
          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref }}

      - name: Set deploy metadata
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "STAGING_PORT=${STAGING_PORT:-22}" >> "$GITHUB_ENV"
          echo "REMOTE_APP_DIR=${REMOTE_APP_DIR:-/home/${STAGING_USER}/mysawit-shipment}" >> "$GITHUB_ENV"
          echo "SHIPMENT_HOST_PORT=${SHIPMENT_HOST_PORT:-8084}" >> "$GITHUB_ENV"
          echo "JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}" >> "$GITHUB_ENV"

      - name: Prepare SSH client
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$STAGING_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$STAGING_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Create runtime env file
        run: |
          set -euo pipefail
          {
            echo "SERVER_PORT=8084"
            echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}"
            echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}"
            echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRATION=${JWT_EXPIRATION}"
            echo "CORS_ORIGINS=${CORS_ORIGINS}"
          } > .env.deploy

      - name: Upload app source and env file
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            -czf /tmp/mysawit-shipment-src.tgz .

          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_APP_DIR'"

          scp -P "$STAGING_PORT" /tmp/mysawit-shipment-src.tgz "$STAGING_USER@$STAGING_HOST:/tmp/mysawit-shipment-src.tgz"
          scp -P "$STAGING_PORT" .env.deploy "$STAGING_USER@$STAGING_HOST:$REMOTE_APP_DIR/.env"

          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" "tar -xzf /tmp/mysawit-shipment-src.tgz -C '$REMOTE_APP_DIR'"

      - name: Build and run shipment container
        run: |
          set -euo pipefail
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "export REMOTE_APP_DIR='$REMOTE_APP_DIR' IMAGE_TAG='$IMAGE_TAG' SHIPMENT_HOST_PORT='$SHIPMENT_HOST_PORT'; bash -s" <<'EOSSH'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"

          DOCKER_BIN="docker"
          if ! docker info >/dev/null 2>&1; then
            DOCKER_BIN="sudo docker"
          fi

          $DOCKER_BIN build -t "mysawit-shipment:${IMAGE_TAG}" -t mysawit-shipment:latest .
          $DOCKER_BIN rm -f mysawit-shipment >/dev/null 2>&1 || true

          $DOCKER_BIN run -d \
            --name mysawit-shipment \
            --env-file .env \
            -p "${SHIPMENT_HOST_PORT}:8084" \
            --restart unless-stopped \
            "mysawit-shipment:${IMAGE_TAG}"
          EOSSH

      - name: Verify service health
        run: |
          set -euo pipefail
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "export SHIPMENT_HOST_PORT='$SHIPMENT_HOST_PORT'; bash -s" <<'EOSSH'
          set -euo pipefail

          DOCKER_BIN="docker"
          if ! docker info >/dev/null 2>&1; then
            DOCKER_BIN="sudo docker"
          fi

          for i in $(seq 1 24); do
            if command -v curl >/dev/null 2>&1 && curl -fsS "http://localhost:${SHIPMENT_HOST_PORT}/actuator/health" >/dev/null; then
              echo "Shipment service is healthy"
              exit 0
            fi
            if command -v wget >/dev/null 2>&1 && wget -qO- "http://localhost:${SHIPMENT_HOST_PORT}/actuator/health" >/dev/null; then
              echo "Shipment service is healthy"
              exit 0
            fi
            sleep 5
          done

          $DOCKER_BIN logs --tail 200 mysawit-shipment || true
          echo "::error::Shipment service health check failed"
          exit 1
          EOSSH
