name: CD - Deploy Shipment to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipment-cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shipment Service (EC2 IPv6 Direct DB)
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PORT: ${{ vars.STAGING_PORT }}
      REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
      SHIPMENT_HOST_PORT: ${{ vars.SHIPMENT_HOST_PORT }}
      JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}

    steps:
      - name: Validate deployment inputs and secrets
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          set -euo pipefail

          required_values=(
            STAGING_HOST
            STAGING_USER
            STAGING_SSH_KEY
            SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD
            JWT_SECRET
            CORS_ORIGINS
          )

          missing=()
          for key in "${required_values[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

          DATASOURCE_URL="${SPRING_DATASOURCE_URL:-}"
          if [ -z "$DATASOURCE_URL" ]; then
            echo "::error::Missing datasource URL. Set SPRING_DATASOURCE_URL to the Supabase Direct Connection JDBC URL."
            exit 1
          fi

          if [[ "$DATASOURCE_URL" != jdbc:postgresql://* ]]; then
            echo "::error::Datasource URL must be a PostgreSQL JDBC URL."
            exit 1
          fi

          if [[ "$DATASOURCE_URL" != *"sslmode=require"* ]]; then
            echo "::warning::Datasource URL does not contain sslmode=require. Supabase Direct Connection normally requires SSL."
          fi

          if [ "${SHIPMENT_HOST_PORT:-8084}" != "8084" ]; then
            echo "::error::SHIPMENT_HOST_PORT must stay 8084 when using Docker host networking."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build shipment JAR
        run: ./gradlew --no-daemon clean test bootJar

      - name: Set deploy metadata
        env:
          INPUT_JAVA_OPTS: ${{ vars.JAVA_OPTS }}
          INPUT_JAVA_TOOL_OPTIONS: ${{ vars.JAVA_TOOL_OPTIONS }}
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "STAGING_PORT=${STAGING_PORT:-22}" >> "$GITHUB_ENV"
          echo "REMOTE_APP_DIR=${REMOTE_APP_DIR:-/home/${STAGING_USER}/apps/mysawit-shipment-service}" >> "$GITHUB_ENV"
          echo "SHIPMENT_HOST_PORT=${SHIPMENT_HOST_PORT:-8084}" >> "$GITHUB_ENV"
          echo "JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}" >> "$GITHUB_ENV"
          echo "JAVA_OPTS=${INPUT_JAVA_OPTS:--Xms256m -Xmx768m}" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=${INPUT_JAVA_TOOL_OPTIONS:--Djava.net.preferIPv6Addresses=true -Djava.net.preferIPv4Stack=false -Dsun.net.inetaddr.ttl=60}" >> "$GITHUB_ENV"

      - name: Create release bundle
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          set -euo pipefail
          sanitize_single_line() {
            local key="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::${key} must be single-line for Docker env-file usage"
              exit 1
            fi
          }

          DATASOURCE_URL="${SPRING_DATASOURCE_URL:-}"

          sanitize_single_line "SPRING_DATASOURCE_URL" "$DATASOURCE_URL"
          sanitize_single_line "SPRING_DATASOURCE_USERNAME" "$SPRING_DATASOURCE_USERNAME"
          sanitize_single_line "SPRING_DATASOURCE_PASSWORD" "$SPRING_DATASOURCE_PASSWORD"
          sanitize_single_line "JWT_SECRET" "$JWT_SECRET"
          sanitize_single_line "JWT_EXPIRATION" "$JWT_EXPIRATION"
          sanitize_single_line "CORS_ORIGINS" "$CORS_ORIGINS"
          sanitize_single_line "JAVA_OPTS" "$JAVA_OPTS"
          sanitize_single_line "JAVA_TOOL_OPTIONS" "$JAVA_TOOL_OPTIONS"

          mkdir -p release/build/libs release/scripts
          shopt -s nullglob
          jar_candidates=(build/libs/*.jar)
          if [ "${#jar_candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one boot JAR in build/libs but found ${#jar_candidates[@]}"
            ls -la build/libs || true
            exit 1
          fi
          cp Dockerfile release/Dockerfile
          install -m 644 "${jar_candidates[0]}" release/build/libs/app.jar
          cp scripts/deploy-ec2.sh release/scripts/deploy-ec2.sh
          chmod 755 release/scripts/deploy-ec2.sh

          {
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'SERVER_PORT=8084\n'
            printf 'SPRING_DATASOURCE_URL=%s\n' "$DATASOURCE_URL"
            printf 'SPRING_DATASOURCE_USERNAME=%s\n' "$SPRING_DATASOURCE_USERNAME"
            printf 'SPRING_DATASOURCE_PASSWORD=%s\n' "$SPRING_DATASOURCE_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRATION=%s\n' "$JWT_EXPIRATION"
            printf 'CORS_ORIGINS=%s\n' "$CORS_ORIGINS"
            printf 'JAVA_OPTS=%s\n' "$JAVA_OPTS"
            printf 'JAVA_TOOL_OPTIONS=%s\n' "$JAVA_TOOL_OPTIONS"
          } > release/.env.deploy

          chmod 600 release/.env.deploy
          tar -czf release.tgz -C release .

      - name: Prepare SSH client
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$STAGING_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null
          ssh-keyscan -T 30 -p "$STAGING_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts || true

      - name: Verify SSH access to EC2
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new -p $STAGING_PORT"
          ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "echo 'SSH_OK'"

      - name: Upload release bundle
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new -p $STAGING_PORT"
          REMOTE_RELEASE_DIR="${REMOTE_APP_DIR}/releases/${IMAGE_TAG}"
          echo "REMOTE_RELEASE_DIR=${REMOTE_RELEASE_DIR}" >> "$GITHUB_ENV"

          ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_RELEASE_DIR' '$REMOTE_APP_DIR/shared'"
          scp -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new -P "$STAGING_PORT" release.tgz "$STAGING_USER@$STAGING_HOST:$REMOTE_APP_DIR/release-${IMAGE_TAG}.tgz"
          ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "tar -xzf '$REMOTE_APP_DIR/release-${IMAGE_TAG}.tgz' -C '$REMOTE_RELEASE_DIR' && rm -f '$REMOTE_APP_DIR/release-${IMAGE_TAG}.tgz'"

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new -p $STAGING_PORT"
          ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" \
            "export APP_HOME='$REMOTE_APP_DIR' RELEASE_DIR='$REMOTE_RELEASE_DIR' IMAGE_TAG='$IMAGE_TAG' APP_NAME='mysawit-shipment' CONTAINER_NAME='mysawit-shipment' APP_PORT='8084' HOST_PORT='$SHIPMENT_HOST_PORT' DEPLOY_LOG='$REMOTE_APP_DIR/deploy.log'; bash '$REMOTE_RELEASE_DIR/scripts/deploy-ec2.sh'"

      - name: Fetch deployment diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new -p $STAGING_PORT"
          ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "tail -n 250 '$REMOTE_APP_DIR/deploy.log' || true; (docker ps -a || sudo docker ps -a || true); (docker logs --tail 250 mysawit-shipment || sudo docker logs --tail 250 mysawit-shipment || true)"
