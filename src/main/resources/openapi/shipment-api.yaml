openapi: 3.0.3
info:
  title: MySawit Shipment Service API
  version: 1.0.0
  description: >
    Shipment Service API contract.
    Security rules:
    - JWT required with valid signature (401 if missing/invalid/expired)
    - SUPIR role required (403 if wrong role)
    - Owner-only access by JWT claim userId (403 if not owner)

servers:
  - url: http://localhost:8084
    description: Local
  - url: https://api.mysawit.example.com
    description: Public ALB base URL (path routing)

tags:
  - name: Shipments
  - name: Health

paths:
  /api/shipments:
    get:
      tags: [Shipments]
      summary: List shipments for authenticated SUPIR
      description: Returns only shipments owned by authenticated user (claim userId).
      operationId: listMyShipments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of owned shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentResponse'
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value: { error: "Unauthorized" }
        "403":
          description: Wrong role (not SUPIR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value: { error: "Forbidden" }

  /api/shipments/{id}:
    get:
      tags: [Shipments]
      summary: Get shipment detail (owner only)
      operationId: getShipmentById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Shipment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role or not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notOwner:
                  value:
                    error: FORBIDDEN
                    message: Forbidden
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    error: NOT_FOUND
                    message: Shipment not found with id: 8f2189a4-a032-495a-8138-cbf5e83f9c89

  /api/shipments/{id}/status:
    patch:
      tags: [Shipments]
      summary: Update shipment status (owner SUPIR only)
      description: >
        Allowed transitions only:
        MEMUAT -> MENGIRIM -> TIBA.
        Skipping is forbidden and TIBA is terminal.
      operationId: updateShipmentStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentStatusRequest'
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  value:
                    error: BAD_REQUEST
                    message: Invalid status value
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role or not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTransition:
                  value:
                    error: INVALID_STATUS_TRANSITION
                    message: Invalid status transition

  /api/shipments/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: shipmentHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ShipmentStatus:
      type: string
      enum: [MEMUAT, MENGIRIM, TIBA]

    ShipmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        harvestId:
          type: string
          format: uuid
        supirUserId:
          type: string
          format: uuid
          description: Owner userId from JWT claim.
        destination:
          type: string
        totalKg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - harvestId
        - supirUserId
        - destination
        - totalKg
        - status
        - createdAt
        - updatedAt

    UpdateShipmentStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ShipmentStatus'
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: mysawit-shipment-service
      required:
        - status
        - service
