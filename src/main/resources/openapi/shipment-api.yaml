openapi: 3.0.3
info:
  title: MySawit Shipment Service API
  version: 1.0.0
  description: >
    Shipment Service API contract.
    Security rules:
    - JWT required with valid signature (401 if missing/invalid/expired)
    - SUPIR role required (403 if wrong role)
    - Owner-only access by JWT claim userId (403 if not owner)

servers:
  - url: http://localhost:8084
    description: Local
  - url: https://api.mysawit.example.com
    description: Public ALB base URL (path routing)

tags:
  - name: Shipments
  - name: Health

paths:
  /api/shipments:
    get:
      tags: [Shipments]
      summary: List shipments by authenticated role
      description: >
        SUPIR receives only their own shipments and can filter by date/status.
        MANDOR receives shipments they created and can filter by supir/date/status.
        ADMIN receives MANDOR_APPROVED shipments by default and can filter by mandor name/date/status.
      operationId: listMyShipments
      security:
        - bearerAuth: []
      parameters:
        - name: mandorName
          in: query
          required: false
          schema:
            type: string
          description: Admin-only Mandor name search.
        - name: supirName
          in: query
          required: false
          schema:
            type: string
          description: Mandor-only Supir name search.
        - name: supirUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Mandor-only Supir profile filter.
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ShipmentStatus'
          description: Optional status filter. Admin defaults to MANDOR_APPROVED when omitted.
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Optional shipment creation date filter.
      responses:
        "200":
          description: List of owned shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentResponse'
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value: { error: "Unauthorized" }
        "403":
          description: Wrong role or forbidden access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value: { error: "Forbidden" }

    post:
      tags: [Shipments]
      summary: Create a new shipment (MANDOR only)
      description: >
        Mandor creates a shipment by selecting locally replicated harvests whose status is
        APPROVED and assigning a supir from the same plantation. Total weight must not
        exceed 400 kg, and harvests cannot be claimed by another shipment.
      operationId: createShipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "400":
          description: Validation error, invalid harvest status, or weight exceeds 400 kg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                weightExceeded:
                  value:
                    error: WEIGHT_EXCEEDED
                    message: Total weight 450.0 kg exceeds maximum of 400 kg
                harvestValidationFailed:
                  value:
                    error: HARVEST_VALIDATION_FAILED
                    message: Harvest status must be Approved: 60060060-0600-6006-0060-060060060060
        "404":
          description: Requested harvest was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                harvestNotFound:
                  value:
                    error: HARVEST_VALIDATION_FAILED
                    message: Harvest not found: 60060060-0600-6006-0060-060060060060
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role (not MANDOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Harvest has already been claimed or is duplicated in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                harvestAlreadyClaimed:
                  value:
                    error: HARVEST_VALIDATION_FAILED
                    message: Harvest already claimed: 60060060-0600-6006-0060-060060060060
                duplicateHarvestId:
                  value:
                    error: HARVEST_VALIDATION_FAILED
                    message: Duplicate harvest id in request: 60060060-0600-6006-0060-060060060060
        "503":
          description: Harvest replica is not yet available for this harvest id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                harvestReplicaUnavailable:
                  value:
                    error: HARVEST_REPLICA_UNAVAILABLE
                    message: Harvest data not yet replicated

  /api/shipments/available-supirs:
    get:
      tags: [Shipments]
      summary: List same-plantation supirs for authenticated MANDOR
      operationId: listAvailableSupirs
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Optional Supir name search.
      responses:
        "200":
          description: Supirs assigned to the same plantation as the authenticated Mandor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupirAssignmentResponse'
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role (not MANDOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/shipments/{id}:
    get:
      tags: [Shipments]
      summary: Get shipment detail (owner only)
      operationId: getShipmentById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Shipment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role or not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notOwner:
                  value:
                    error: FORBIDDEN
                    message: Forbidden
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    error: NOT_FOUND
                    message: Shipment not found with id: 8f2189a4-a032-495a-8138-cbf5e83f9c89

  /api/shipments/{id}/status:
    patch:
      tags: [Shipments]
      summary: Update shipment status (owner SUPIR only)
      description: >
        Allowed transitions only:
        MEMUAT -> MENGIRIM -> TIBA.
        Skipping is forbidden. Once TIBA, the shipment is ready for Mandor approval.
      operationId: updateShipmentStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentStatusRequest'
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  value:
                    error: BAD_REQUEST
                    message: Invalid status value
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role or not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTransition:
                  value:
                    error: INVALID_STATUS_TRANSITION
                    message: Invalid status transition

  /api/shipments/{id}/mandor-approval:
    patch:
      tags: [Shipments]
      summary: Mandor approval for arrived shipment
      description: >
        Mandor approval is only allowed after the shipment has reached TIBA.
        Valid decisions are MANDOR_APPROVED and MANDOR_REJECTED. Rejection requires a reason.
        MANDOR_APPROVED publishes a shipment.approved-by-mandor event for Supir payroll.
      operationId: approveShipmentByMandor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandorApprovalRequest'
      responses:
        "200":
          description: Mandor approval decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "400":
          description: Invalid approval decision payload or missing rejection reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role (not MANDOR) or not owner Mandor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Shipment has not reached TIBA yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/shipments/{id}/admin-approval:
    patch:
      tags: [Shipments]
      summary: Admin approval for Mandor-approved shipment
      description: >
        Admin approval is only allowed after MANDOR_APPROVED.
        Valid decisions are ADMIN_APPROVED, ADMIN_REJECTED, and PARTIALLY_REJECTED.
        Rejection requires a reason. Partial rejection requires kgAccepted and a reason.
        ADMIN_APPROVED and PARTIALLY_REJECTED publish shipment.approved-by-admin for Mandor payroll.
      operationId: approveShipmentByAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminApprovalRequest'
      responses:
        "200":
          description: Admin approval decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        "400":
          description: Invalid approval decision payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidDecision:
                  value:
                    error: BAD_REQUEST
                    message: Invalid admin approval decision
                missingAcceptedKg:
                  value:
                    error: BAD_REQUEST
                    message: Accepted kg is required for partial rejection
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Wrong role (not ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    error: FORBIDDEN
                    message: Forbidden
        "404":
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Shipment has not been approved by Mandor yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notArrived:
                  value:
                    error: INVALID_STATUS_TRANSITION
                    message: Shipment must be approved by Mandor before admin approval

  /api/shipments/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: shipmentHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ShipmentStatus:
      type: string
      enum: [MEMUAT, MENGIRIM, TIBA, MANDOR_APPROVED, MANDOR_REJECTED, ADMIN_APPROVED, ADMIN_REJECTED, PARTIALLY_REJECTED]

    ShipmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mandorUserId:
          type: string
          format: uuid
          description: Mandor who created the shipment.
        mandorName:
          type: string
        supirUserId:
          type: string
          format: uuid
          description: Owner userId from JWT claim.
        supirName:
          type: string
        destination:
          type: string
        plantationId:
          type: string
        totalKg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        kgAccepted:
          type: number
          format: double
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItemResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mandorReviewedAt:
          type: string
          format: date-time
          nullable: true
        adminReviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - mandorUserId
        - supirUserId
        - destination
        - plantationId
        - totalKg
        - status
        - items
        - createdAt
        - updatedAt

    ShipmentItemResponse:
      type: object
      properties:
        harvestId:
          type: string
          format: uuid
        weightKg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
      required:
        - harvestId
        - weightKg

    UpdateShipmentStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ShipmentStatus'
      required:
        - status

    AdminApprovalRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ADMIN_APPROVED, ADMIN_REJECTED, PARTIALLY_REJECTED]
        rejectionReason:
          type: string
          description: Required for ADMIN_REJECTED and PARTIALLY_REJECTED.
        kgAccepted:
          type: number
          format: double
          description: Required for PARTIALLY_REJECTED.
      required:
        - status

    MandorApprovalRequest:
      type: object
      properties:
        status:
          type: string
          enum: [MANDOR_APPROVED, MANDOR_REJECTED]
        rejectionReason:
          type: string
          description: Required for MANDOR_REJECTED.
      required:
        - status

    SupirAssignmentResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        plantationId:
          type: string
      required:
        - userId
        - plantationId

    CreateShipmentRequest:
      type: object
      properties:
        supirUserId:
          type: string
          format: uuid
          description: Driver assigned to this shipment.
        destination:
          type: string
          description: Delivery destination.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HarvestItemRequest'
      required:
        - supirUserId
        - destination
        - items

    HarvestItemRequest:
      type: object
      properties:
        harvestId:
          type: string
          format: uuid
        weightKg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
      required:
        - harvestId
        - weightKg

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: mysawit-shipment-service
      required:
        - status
        - service
